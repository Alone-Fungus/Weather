<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Forecast & Clothing Recommender</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 24px;
    }

    .container {
      max-width: 950px;
      margin: 0 auto;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    input {
      flex: 1;
      min-width: 220px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #e2e8f0;
    }

    button {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background: #38bd38;
      color: #06243b;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary {
      background: #334155;
      color: #e2e8f0;
    }

    #status {
      margin: 8px 0;
      color: #94a3b8;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
    }

    .date {
      font-weight: bold;
      margin-bottom: 6px;
    }

    .meta {
      font-size: 0.9rem;
      margin: 4px 0;
    }

    .recomend {
      margin-top: 8px;
      color: #dbeafe;
    }
  </style>
</head>


<body>
  <div class="container">
    <h1>Weather Forecast & Clothing Recomender</h1>
    <p class="subtitle">Check upcoming days and get outfit suggestions</p>
    <div class="controls">
      <input id="cityInput" type="text" placeholder="Enter city name" />
      <button id="searchBtn">Get Forecast</button>
      <button id="geoBtn" class="secondary">Use My Location</button>
    </div>
    <div id="status"></div>
    <div id="locationTitle" class="location-title"></div>
    <div id="forecastGrid" class="grid"></div>
  </div>

</body>

</html>
